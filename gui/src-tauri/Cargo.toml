[package]
name = "ombro-gui"
version = "0.3.0"
description = "Ombro desktop app"
license = "AGPL-3.0-only"
authors = ["Heliotrope Atelier Ltd"]
edition = "2021"
publish = false

[lib]
name = "ombro_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.5", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "=2.6.0"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-notification = "=2.8.1"
tauri-plugin-dialog = "=2.8.4"
# The window opens at the size and place it had when Ombro last quit.
tauri-plugin-window-state = "=2.5.0"
# Updates: a signed manifest (latest.json) on GitHub Releases.
tauri-plugin-updater = "=2.14.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "net", "io-util", "process", "time", "macros"] }

# The server's token, kept in the system keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", features = ["apple-native"] }
# setxattr, to quarantine copies saved from a server.
libc = "0.2"
# System notifications through the User Notifications framework (notify.rs); already in the tree via Tauri.
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger", "UNUserNotificationCenter"] }
block2 = "=0.6.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
# Opening Ombro again brings back the running app's window (macOS does this itself).
tauri-plugin-single-instance = "=2.5.5"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
