# Ombro as a server in Docker. Start it with `docker compose up -d`; the pairing code is in
# `docker compose logs ombro`. In the app, connect by address to 127.0.0.1:8765 with that code.

name: ombro

services:
  ombro:
    build: .
    image: ombro:local
    restart: unless-stopped
    # This machine only. To reach it from another computer, use SSH or Tailscale, not a public port.
    # For Tailscale, publish on this machine's Tailscale address instead (`tailscale ip -4`):
    #   - "100.x.y.z:8765:8765"
    # With Colima on a Mac, start it with `colima start --network-host-addresses` first: Docker runs
    # in Colima's VM, which otherwise doesn't have that address. Never publish on every address.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - ombro-settings:/home/ombro/.config/ombro   # settings, keys and sign-ins
      - ombro-files:/home/ombro/Ombro              # jobs and chats
      # A folder to share with jobs: mount it under /home/ombro/shared, then share
      # /home/ombro/shared/<name> in Settings › Folders. Add :ro to keep it read-only.
      # - ~/Documents/Brand:/home/ombro/shared/brand
    # Code a job writes runs inside bubblewrap, Ombro's sandbox: no internet, and only that job's
    # files. bubblewrap needs Linux namespaces, which Docker's default filters block, so these
    # three settings relax them for this container. Ombro still runs as an ordinary user here.
    # Without them, everything else works and jobs say code can't run. On some Ubuntu hosts (24.04;
    # Colima's VM is one), also load Ombro's AppArmor profile there once:
    # `docker compose exec ombro ombro sandbox` says how.
    # The browser service below, when it runs: crews and chat read web pages in it.
    environment:
      OMBRO_BROWSER_ENDPOINT: http://browser:9222
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined

  # A browser for crews and chat: a headless Chromium in a container of its own, which never sees
  # Ombro's keys or settings. Each job gets a new, empty profile in it. Optional: start it with
  #   docker compose --profile browser up -d
  # Without it, web search still works but web pages can't be read (Settings › General says so).
  browser:
    image: chromedp/headless-shell:stable
    profiles: [browser]
    restart: unless-stopped
    shm_size: 1gb
    # No ports: only Ombro, on this compose network, reaches it.

volumes:
  ombro-settings:
  ombro-files:
