[project]
name = "ombro"
version = "0.1.0"
description = "A small local harness for briefing a crew of AI roles and getting bounded, reported work back."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.20",
]

[project.scripts]
ombro = "ombro.cli:main"
ombro-fake-mcp = "ombro.fake_mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ombro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
