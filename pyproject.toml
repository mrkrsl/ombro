[project]
name = "ombro"
dynamic = ["version"]  # from src/ombro/__init__.py; tests/test_version.py checks the app matches
description = "A small local harness for briefing a crew of AI roles and getting bounded, reported work back."
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Heliotrope Atelier Ltd" }]
requires-python = ">=3.11"
# Minimums are the versions tested in uv.lock. `uv tool install` does not read the
# lock, so these are what keep an install off older releases with known holes.
dependencies = [
    "httpx>=0.28.1",
    "httpcore>=1.0.9",
    "h11>=0.16.0",  # CVE-2025-43859 is fixed from 0.16.0
    "PyYAML>=6.0.3",
    "jsonschema>=4.26.0",
    "textual>=8.2.8",
    "starlette>=1.10.0",
    "websockets>=17.4",
    "uvicorn>=0.54.0",
    "pypdf>=7.1.1",  # 6.x before 6.4 had denial-of-service fixes for crafted PDFs
    "typing-extensions>=4.16.0",  # TypedDicts that pydantic accepts on 3.11
]

[project.scripts]
ombro = "ombro.cli:main"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pydantic>=2.14.3",  # gui/scripts/schema.py only: the app's generated types
    "pytest>=8",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/ombro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ombro"]

# The source package is the Python core only: the desktop app (gui/) is built and released apart.
[tool.hatch.build.targets.sdist]
include = ["/src/ombro", "/tests", "/examples", "/README.md", "/uv.lock"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-include = ["gui/scripts/*.py"]

[tool.ruff.lint]
# The core rules only (syntax, undefined and unused names), named so a new ruff doesn't widen them.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Shared fixtures are imported from conftest and taken as parameters, which ruff reads as redefinitions.
"tests/*" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
