# The contributor agreement (CLA.md): checks that everyone on a pull request has accepted it, and
# records an acceptance when someone comments the sentence. The work is in .github/scripts/cla.js.
#
# pull_request_target runs this file and the script as they are on main, never the pull request's
# code, so a pull request from a fork can't change the check. Nothing from the pull request is
# checked out or run.
name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' || (github.event.issue.pull_request &&
      (contains(github.event.comment.body, 'Ombro Contributor Agreement') || github.event.comment.body == 'recheck'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the signatures file, on the cla-signatures branch
      pull-requests: write # the comment asking for it
      statuses: write # the "CLA" status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const cla = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/cla.js`);
            await cla({ github, context, core });
