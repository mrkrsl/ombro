# OpenSSF Scorecard: an outside check of the project's security practices (pinned actions,
# token permissions, branch protection, known vulnerabilities, signed releases and so on).
#
# It runs on every push to main, when branch protection changes, and weekly. Results go to the
# Security tab (code scanning) and are published to api.scorecard.dev, which the badge reads:
#   https://scorecard.dev/viewer/?uri=github.com/mrkrsl/ombro
#
# A workflow of its own, as publishing the results needs a job with only these steps and
# permissions. To run it by hand on a Mac: brew install scorecard, then
#   GITHUB_AUTH_TOKEN=$(gh auth token) scorecard --repo=github.com/mrkrsl/ombro --show-details
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "41 6 * * 1" # Mondays, after CI's weekly audits
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # the results, in the Security tab
      id-token: write # publishing them, for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
