# When a release drafted by release.yml is published by hand: the Python packages go to PyPI (to
# TestPyPI for a pre-release such as v0.2.0-rc1), and a full release's Docker images become
# `latest`. Kept apart from release.yml because neither can be taken back: PyPI never takes the
# same version twice.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # trusted publishing: no token is stored anywhere
    steps:
      - name: The packages attached to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'ombro-*.whl' --pattern 'ombro-*.tar.gz'
      - name: TestPyPI (a pre-release)
        if: github.event.release.prerelease
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: PyPI
        if: ${{ !github.event.release.prerelease }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  latest:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: The version's images become latest
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for image in ombro ombro-browser-guard; do
            docker buildx imagetools create -t "$base/$image:latest" "$base/$image:${TAG#v}"
          done
